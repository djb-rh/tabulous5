; Tabulous5 — a party-game console for the M5Stack Tab5 (ESP32-P4).
;
; The Tab5's P4 is only supported by the pioarduino fork of platform-espressif32
; (upstream PlatformIO's espressif32 has no P4 support at all), so the platform
; URL is pinned rather than named.
;
; The m5stack-tab5-p4 board definition brings the Tab5 variant with it, which
; matters for two reasons: it sets PSRAM/flash timing correctly, and it defines
; BOARD_SDIO_ESP_HOSTED_* (CLK 12, CMD 13, D0 11, D1 10, D2 9, D3 8, RST 15) so
; WiFi over the ESP32-C6 co-processor configures itself. Those pins match the
; esp32_hosted block in the ESPHome Tab5 config that already drives this
; hardware.
;
; The board's own init script installs M5Unified (and M5GFX with it) from git,
; so they are deliberately NOT listed in lib_deps — listing them would pull a
; second, conflicting copy.

[platformio]
default_envs = tab5

[common_tab5]
; -O2 over the Arduino core's default -Os. The NES core is an interpreter
; loop, and size-optimised builds of those are dramatically slower; measured
; below on real hardware rather than assumed.
build_unflags = -Os
; No -I for the emulator core on purpose. Its directory holds bus.h, mapper.h,
; cartridge.h and friends, and putting that on the GLOBAL include path lets it
; shadow other libraries' headers of the same name. Doing exactly that with
; config.h and debug.h produced a clean build that died before main(). Quoted
; includes already search the including file's own directory, so the core finds
; its own headers without help; everything reaching in uses a relative path.
; The Doom engine is C, narrates to stdout, and has more globals than the
; RISC-V small-data window holds: dg_print.h is force-included into every C
; file (it is empty for C++) to route its printing, CMAP256 and the 320x200
; size are how it is asked to hand over frames, and -msmall-data-limit=0
; keeps the link from failing over .sdata, as the SNES core needs too.
build_flags = -O2 -DMINIGB_APU_AUDIO_FORMAT_S16SYS -DNAMCO_PACMAN
              -DDG_TABULOUS -DCMAP256 -DDOOMGENERIC_RESX=320 -DDOOMGENERIC_RESY=200
              -include $PROJECT_DIR/third_party/doomgeneric/dg_print.h
              -msmall-data-limit=0
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; The board definition installs M5Unified from git itself; the M5GFX it now
; wants (>= 0.2.29) is newer than the registry's, so name the git one here.
lib_deps = https://github.com/M5Stack/M5GFX.git
; No upload_port/monitor_port on purpose. The Tab5's USB-serial-JTAG
; enumerates under a different name depending on which physical USB port it is
; plugged into (usbmodem101 vs usbmodem1101), and esptool takes the value
; literally — a glob does not expand. Letting PlatformIO auto-detect handles
; both without anyone editing this file.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; The game.
[env:tab5]
extends = common_tab5
; Builds the SNES core in only if the builder has fetched it; see
; third_party/snes9x/README.md.
extra_scripts = pre:tools/optional_snes.py
build_src_filter = +<*> -<spike/> -<bench/> -<hello/>
                  +<../third_party/peanut_gb/minigb_apu.c> +<../third_party/chips/chips_impl.c> +<../third_party/z80/z80_sz.c> +<../third_party/anemoia/*.cpp> +<../third_party/anemoia/core/*.cpp>
                  +<../third_party/anemoia/core/mappers/*.cpp>
                  +<../third_party/doomgeneric/*.c>


; Display throughput benchmark, to decide whether an emulator can hit 60 fps
; at a given integer scale. Not part of the app.
[env:bench]
extends = common_tab5
build_src_filter = +<bench/>

; Bare serial liveness test — nothing but Serial.printf in a loop.
[env:hello]
extends = common_tab5
build_src_filter = +<hello/>

; Phase 0 hardware smoke test — display, speaker, LittleFS, WiFi, touch.
; Kept around as a bring-up tool; all five checks passed on 2026-09-04.
[env:spike]
extends = common_tab5
build_src_filter = +<spike/>

; Host-side unit tests for the hardware-independent logic: pack parsing, the
; shuffle bag, the beep curve, and the game rules. Run with: pio test -e native
;
; build_src_filter excludes anything that pulls in Arduino headers, so only the
; pure-logic translation units build here.
[env:native]
platform = native
test_framework = unity
; pio test does not compile project sources unless asked, and the tests need
; pack.cpp / round_timer.cpp / game.cpp linked in.
test_build_src = yes
build_src_filter = +<pack.cpp> +<round_timer.cpp> +<wav.cpp> +<joypad.cpp> +<nesrom.cpp> +<gbrom.cpp> +<arcrom.cpp> +<rom_index.cpp> +<padmap.cpp> +<fourway.cpp> +<phrase_game.cpp> +<fivehead.cpp> +<minesweeper.cpp> +<sudoku.cpp> +<solitaire.cpp>
build_flags = -std=c++17 -Isrc -Wall -Wextra
